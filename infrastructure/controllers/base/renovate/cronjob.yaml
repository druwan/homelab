apiVersion: batch/v1
kind: CronJob
metadata:
  name: renovate
  namespace: renovate
spec:
  schedule: "0 */6 * * *" # Every 6th hour
  timeZone: "Europe/Stockholm"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          restartPolicy: Never
          securityContext:
            fsGroup: 12021
          containers:
            - name: renovate
              image: renovate/renovate:latest
              args:
                - druwan/homelab
              envFrom:
                - secretRef:
                    name: renovate-bot-secret
                - configMapRef:
                    name: renovate-configmap
              volumeMounts:
                - name: cache
                  mountPath: /tmp/renovate
          volumes:
            - name: cache
              persistentVolumeClaim:
                claimName: renovate-cache
