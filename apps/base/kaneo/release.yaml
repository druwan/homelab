apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kaneo
  namespace: kaneo
spec:
  interval: 30m
  chart:
    spec:
      chart: kaneo
      version: "2.22.0"
      sourceRef:
        kind: HelmRepository
        name: kaneo
  values:
    postgresql:
      enabled: false # CNPG handles the DB
    podSecurityContext:
      fsGroup: 1001
      fsGroupChangePolicy: OnRootMismatch
    kaneo:
      env:
        clientUrl: "https://kaneo.christophervestman.com"
        existingSecret:
          enabled: true
          name: kaneo-db-credentials
          key: auth-secret
        database:
          external:
            enabled: true
            existingSecret:
              enabled: true
              name: kaneo-db-credentials
              passwordKey: postgres_uri
      extraEnv:
        - name: KANEO_ALLOW_PRIVATE_WEBHOOK_DESTINATIONS
          value: "true"
        - name: NOTIFICATION_SECRET_ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: kaneo-db-credentials
              key: notification-key
        - name: CUSTOM_OAUTH_DISCOVERY_URL
          value: "https://authentik.christophervestman.com/application/o/kaneo/.well-known/openid-configuration"
        - name: CUSTOM_OAUTH_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: kaneo-db-credentials
              key: oidc-client-id
        - name: CUSTOM_OAUTH_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: kaneo-db-credentials
              key: oidc-client-secret
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        privileged: false
        readOnlyRootFilesystem: false
        runAsGroup: 1001
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
    ingress:
      enabled: true
      className: traefik
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-production
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
        traefik.ingress.kubernetes.io/router.tls: "true"
      hosts:
        - host: kaneo.christophervestman.com
          paths:
            - path: /
              pathType: Prefix
              service: kaneo
              port: 5173
      tls:
        - secretName: kaneo-tls
          hosts:
            - kaneo.christophervestman.com
