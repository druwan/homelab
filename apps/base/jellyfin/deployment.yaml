apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: jellyfin
  name: jellyfin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      securityContext:
        fsGroup: 3100
        fsGroupChangePolicy: OnRootMismatch
        runAsUser: 33
        runAsGroup: 33
        supplementalGroups: [3100, 989, 1000]
      containers:
        - image: ghcr.io/jellyfin/jellyfin:12.3@sha256:2038fe038ab3876a80f6e7b7e0aef6607b032c7dc0c9b3ad3296d0b2eba3bbb5
          name: jellyfin
          ports:
            - containerPort: 8096
          securityContext:
            privileged: true
          volumeMounts:
            - mountPath: /config
              name: jellyfin-config
            - mountPath: /cache
              name: jellyfin-cache
            - mountPath: /media
              name: media
            - mountPath: /dev/dri/renderD128
              name: render-device
          resources:
            requests:
              memory: 512Mi
            limits:
              memory: 2Gi
      volumes:
        - name: jellyfin-config
          persistentVolumeClaim:
            claimName: jellyfin-config-pvc-v2
        - name: jellyfin-cache
          persistentVolumeClaim:
            claimName: jellyfin-cache-pvc-v2
        - name: media
          persistentVolumeClaim:
            claimName: media-pvc
        - name: render-device
          hostPath:
            path: /dev/dri/renderD128
