apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: jellyfin
  name: jellyfin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      securityContext:
        fsGroup: 3100
        fsGroupChangePolicy: OnRootMismatch
        runAsUser: 33
        runAsGroup: 33
        supplementalGroups: [3100, 989]
      containers:
        - image: ghcr.io/jellyfin/jellyfin:12.1@sha256:008ec8024bdaaa6f0a3f0de468e185633eeba9d67c56936e8dbf5ef6b8d6200f
          name: jellyfin
          ports:
            - containerPort: 8096
          securityContext:
            privileged: true
          volumeMounts:
            - mountPath: /config
              name: jellyfin-config
            - mountPath: /cache
              name: jellyfin-cache
            - mountPath: /media
              name: media
            - mountPath: /dev/dri/renderD128
              name: render-device
          resources:
            requests:
              memory: 512Mi
            limits:
              memory: 2Gi
      volumes:
        - name: jellyfin-config
          persistentVolumeClaim:
            claimName: jellyfin-config-pvc-v2
        - name: jellyfin-cache
          persistentVolumeClaim:
            claimName: jellyfin-cache-pvc-v2
        - name: media
          persistentVolumeClaim:
            claimName: media-pvc
        - name: render-device
          hostPath:
            path: /dev/dri/renderD128
