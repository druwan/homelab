apiVersion: apps/v1
kind: Deployment
metadata:
  name: twenty-redis
  namespace: twenty
spec:
  replicas: 1
  selector:
    matchLabels:
      app: twenty-redis
  template:
    metadata:
      labels:
        app: twenty-redis
    spec:
      securityContext:
        fsGroup: 3100
      restartPolicy: Always
      containers:
        - name: twenty-redis
          image: redis:8.10.1@sha256:9c5c616b6e72ea6e38125bb9b12eac2dcd92cd57f8f811ee2fb965ae4cb0f16e
          args:
            - "--maxmemory-policy"
            - "noeviction"
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: twenty-worker
  namespace: twenty
spec:
  replicas: 1
  selector:
    matchLabels:
      app: twenty-worker
  template:
    metadata:
      labels:
        app: twenty-worker
    spec:
      securityContext:
        fsGroup: 3100
      restartPolicy: Always
      containers:
        - name: twenty-worker
          image: twentycrm/twenty:v2.35.0@sha256:a8ab7d34ac102a3c75d4538f917b57ab3f3f853a2afcdf01b4e6fcb7dec2cd6f
          args:
            - "yarn"
            - "worker:prod"
          env:
            - name: PG_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: twenty-db-credentials
                  key: pg_database_url
            - name: STORAGE_TYPE
              value: "local"
            - name: SERVER_URL
              value: "https://twenty.christophervestman.com"
            - name: REDIS_URL
              value: "redis://twenty-redis:6379"
            - name: DISABLE_DB_MIGRATIONS # Runs on server
              value: "true"
            - name: DISABLE_CRON_JOBS_REGISTRATION # Runs on server
              value: "true"

            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: twenty-db-credentials
                  key: encryption_key

            # NOTE: Set to previous ENCRYPTION_KEY during a rotation
            - name: FALLBACK_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: twenty-db-credentials
                  key: fallback_encryption_key
          volumeMounts:
            - name: twenty-data
              mountPath: /app/packages/twenty-server/.local-storage
      volumes:
        - name: twenty-data
          persistentVolumeClaim:
            claimName: twenty-data-pvc-v1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: twenty-server
  namespace: twenty
spec:
  replicas: 1
  selector:
    matchLabels:
      app: twenty-server
  template:
    metadata:
      labels:
        app: twenty-server
    spec:
      securityContext:
        fsGroup: 3100
      restartPolicy: Always
      containers:
        - name: twenty-server
          image: twentycrm/twenty:v2.35.0@sha256:a8ab7d34ac102a3c75d4538f917b57ab3f3f853a2afcdf01b4e6fcb7dec2cd6f
          env:
            - name: PG_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: twenty-db-credentials
                  key: pg_database_url
            - name: NODE_PORT
              value: "3000"
            - name: STORAGE_TYPE
              value: "local"
            - name: SERVER_URL
              value: "https://twenty.christophervestman.com"
            - name: REDIS_URL
              value: "redis://twenty-redis:6379"
            - name: DISABLE_DB_MIGRATIONS
              value: "false"
            - name: DISABLE_CRON_JOBS_REGISTRATION
              value: "false"

            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: twenty-db-credentials
                  key: encryption_key

            # NOTE: Set to previous ENCRYPTION_KEY during a rotation
            - name: FALLBACK_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: twenty-db-credentials
                  key: fallback_encryption_key
          ports:
            - containerPort: 3000
          startupProbe:
            httpGet:
              path: "/healthz"
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30 # 30 x 5 = 150s
          readinessProbe:
            httpGet:
              path: "/healthz"
              port: 3000
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: "/healthz"
              port: 3000
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 10
          volumeMounts:
            - name: twenty-data
              mountPath: /app/packages/twenty-server/.local-storage
      volumes:
        - name: twenty-data
          persistentVolumeClaim:
            claimName: twenty-data-pvc-v1
