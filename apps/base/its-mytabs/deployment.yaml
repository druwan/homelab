apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: its-mytabs
  name: its-mytabs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: its-mytabs
  template:
    metadata:
      labels:
        app: its-mytabs
    spec:
      containers:
        - image: louislam/its-mytabs:1.8.0@sha256:23b86fb46e84699ffb9959a8835b0117d42f2b4c180738ce5a14aee3e5fa0018
          name: its-mytabs
          ports:
            - containerPort: 47777
          volumeMounts:
            - mountPath: /app/data
              name: its-mytabs-data
      volumes:
        - name: its-mytabs-data
          persistentVolumeClaim:
            claimName: its-mytabs-data-pvc
