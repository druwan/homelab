apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: mealie
    role: app
  name: mealie
  namespace: mealie
spec:
  selector:
    matchLabels:
      app: mealie
  template:
    metadata:
      labels:
        app: mealie
        role: app
    spec:
      securityContext:
        fsGroup: 911
        runAsUser: 911
        runAsGroup: 911
      containers:
        - image: ghcr.io/mealie-recipes/mealie:v3.25.0@sha256:a27f0a07d516bf982274cf832fd6cc89793700a7d0701f7d9d4fc1f3ab040a34
          name: mealie
          env:
            - name: DB_ENGINE
              value: postgres
            - name: POSTGRES_DB
              value: "mealie"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mealie-db-credentials
                  key: password
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: mealie-db-credentials
                  key: username
            - name: POSTGRES_SERVER
              value: "mealie-db-v2-rw.mealie.svc.cluster.local"
            - name: TZ
              value: Europe/Stockholm
            - name: OIDC_AUTH_ENABLED
              value: "true"
            - name: OIDC_PROVIDER_NAME
              value: "authentik"
            - name: OIDC_CONFIGURATION_URL
              value: "https://authentik.christophervestman.com/application/o/mealie/.well-known/openid-configuration"

            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: mealie-db-credentials
                  key: authentik-client-id

            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: mealie-db-credentials
                  key: authentik-client-secret

          resources:
            requests:
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            - containerPort: 9000
          volumeMounts:
            - mountPath: /app/data
              name: mealie-data
      volumes:
        - name: mealie-data
          persistentVolumeClaim:
            claimName: mealie-data-pvc-v2
