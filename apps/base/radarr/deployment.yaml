apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: radarr
  name: radarr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: radarr
  template:
    metadata:
      labels:
        app: radarr
    spec:
      securityContext:
        fsGroup: 3100
        supplementalGroups: [3100]
      containers:
        - name: radarr
          image: ghcr.io/linuxserver/radarr:6.4.4.10685-ls325@sha256:ade5937813c6ae415b29db729386e53fea3ecf067a019849bafbe2d2a6ec02ba
          ports:
            - containerPort: 7878
          securityContext:
            allowPrivilegeEscalation: false
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "3100"
            - name: TZ
              value: Europe/Stockholm
          volumeMounts:
            - mountPath: /config
              name: radarr-config
            - mountPath: /media
              name: media
          resources:
            requests:
              memory: 384Mi
            limits:
              memory: 768Mi
      volumes:
        - name: radarr-config
          persistentVolumeClaim:
            claimName: radarr-config-pvc-v2
        - name: media
          persistentVolumeClaim:
            claimName: media-pvc
