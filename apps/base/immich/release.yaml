apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
  namespace: immich
spec:
  interval: 30m
  chart:
    spec:
      chart: immich
      version: "0.13.4"
      sourceRef:
        kind: HelmRepository
        name: immich
        namespace: immich
      interval: 30m
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
  maxHistory: 3 # Limit Helm history to last 3 revs
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: ghcr.io/immich-app/immich-server
              tag: v3.2.4@sha256:d317916b28090c33eb36b308464ea391f8b7df1d850fcfea227a39ec879718c2
              pullPolicy: IfNotPresent
            env:
              - name: DB_HOSTNAME
                value: immich-db-v2-rw.immich.svc.cluster.local
              - name: DB_PORT
                value: 5432
              - name: DB_USERNAME
                value: immich
              - name: DB_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: immich-db-credentials
                    key: password
              - name: DB_DATABASE_NAME
                value: immich

              - name: REDIS_HOSTNAME
                value: '{{ printf "%s-valkey" .Release.Name }}'
              - name: IMMICH_MACHINE_LEARNING_URL
                value: '{{ printf "http://%s-machine-learning:3003" .Release.Name }}'
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
              limits:
                cpu: 1500m
                memory: 4Gi
    immich:
      metrics:
        enabled: true
      persistence:
        library:
          existingClaim: immich-library-pvc-v2
      # configuration is immich-config.json converted to yaml
      # ref: https://immich.app/docs/install/config-file/
      configuration: {}

    # Deps
    valkey:
      enabled: true
      controllers:
        main:
          containers:
            main:
              image:
                repository: docker.io/valkey/valkey
                tag: 9.1.2@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
                pullPolicy: IfNotPresent
      persistence:
        data:
          enabled: false
    server:
      enabled: true
      ingress:
        main:
          enabled: true
          className: traefik
          annotations:
            cert-manager.io/cluster-issuer: letsencrypt-production
            traefik.ingress.kubernetes.io/router.entrypoints: websecure
            traefik.ingress.kubernetes.io/router.tls: "true"
          hosts:
            - host: immich.christophervestman.com
              paths:
                - path: /
                  pathType: Prefix
          tls:
            - secretName: immich-tls
              hosts:
                - immich.christophervestman.com
    machine-learning:
      enabled: true
      controllers:
        main:
          containers:
            main:
              image:
                repository: ghcr.io/immich-app/immich-machine-learning
                tag: v3.2.4@sha256:e16c2f166a8174901959fdf85e2e4c7bd1ebc4b37e0b6655de97c41408a260c4
                pullPolicy: IfNotPresent
              env:
                TRANSFORMERS_CACHE: /cache
                HF_XET_CACHE: /cache/huggingface-xet
                MPLCONFIGDIR: /cache/matplotlib-config
              resources:
                requests:
                  cpu: 250m
                  memory: 1Gi
                limits:
                  cpu: 1000m
                  memory: 2Gi
      persistence:
        cache:
          enabled: true
          type: persistentVolumeClaim
          existingClaim: immich-machine-learning-model-cache-pvc-v2
