apiVersion: v1
kind: Service
metadata:
  name: silo
  namespace: media
  labels:
    app: silo
spec:
  selector:
    app: silo
  ports:
    - name: app
      port: 8080
      targetPort: 8080
    - name: jellyfin
      port: 8096
      targetPort: 8096
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: silo-meili
  namespace: media
spec:
  selector:
    app: silo-meili
  ports:
    - name: meili
      port: 7700
      targetPort: 7700
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: silo-redis
  namespace: media
spec:
  selector:
    app: silo-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
  type: ClusterIP
