apiVersion: apps/v1
kind: Deployment
metadata:
  name: silo-redis
  namespace: media
spec:
  replicas: 1
  selector:
    matchLabels:
      app: silo-redis
  template:
    metadata:
      labels:
        app: silo-redis
    spec:
      containers:
        - name: silo-redis
          image: redis:8.10.3-alpine@sha256:71885d8cc6e42f2bc0aa2eb853bfc4be200b5108a46ac50e117ae1df0531fb80
          ports:
            - containerPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: silo-meili
  namespace: media
spec:
  replicas: 1
  selector:
    matchLabels:
      app: silo-meili
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: silo-meili
    spec:
      containers:
        - name: silo-meili
          image: getmeili/meilisearch:v1.56.2@sha256:9600db22be3fcbf3d506176d3a73dd70a65c5719d9aa1d2837355b75afb8f4fb
          command:
            - /bin/sh
            - -euc
            - |
              if [ -z "${MEILI_MASTER_KEY:-}" ]; then
                echo "MEILI_MASTER_KEY is required" >&2
                exit 1
              fi
              exec /bin/meilisearch
          ports:
            - containerPort: 7700
          env:
            - name: MEILI_UPGRADE_DB
              value: "false"
            - name: MEILI_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: silo-db-credentials
                  key: silo_meili_master_key
          volumeMounts:
            - name: meili-data
              mountPath: /meili_data
      volumes:
        - name: meili-data
          persistentVolumeClaim:
            claimName: silo-meili-data-pvc-v1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: silo
  namespace: media
spec:
  replicas: 1
  selector:
    matchLabels:
      app: silo
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: silo
    spec:
      securityContext:
        supplementalGroups: [3100, 989, 1000]
      containers:
        - name: silo
          image: ghcr.io/silo-server/silo-server:build-2072
          securityContext:
            privileged: true
          env:
            - name: MODE
              value: "integrated"
            - name: PORT
              value: "8080"
            - name: JF_PORT
              value: "8096"
            - name: ENABLE_REDIS
              value: "true"
            - name: REDIS_URL
              value: "redis://silo-redis:6379"
            - name: SILO_SEARCH_PROVIDER
              value: "meilisearch"
            - name: SILO_MEILISEARCH_URL
              value: http://silo-meili:7700
            - name: SILO_MEILISEARCH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: silo-db-credentials
                  key: silo_meili_master_key
            - name: SILO_PLUGIN_CACHE_DIR
              value: "/var/lib/silo/plugins"
            - name: POSTGRES_TUNE
              value: "off"
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: silo-db-credentials
                  key: silo_secret_key
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: silo-db-credentials
                  key: postgres_uri
          ports:
            - name: app
              containerPort: 8080
            - name: jellyfin
              containerPort: 8096
          volumeMounts:
            - name: silo-data
              mountPath: /var/lib/silo/plugins
              subPath: plugins
            - name: silo-data
              mountPath: /var/lib/silo/artwork
              subPath: artwork
            - name: silo-data
              mountPath: /var/lib/silo/compat
              subPath: compat
            - name: silo-data
              mountPath: /tmp/silo-transcode
              subPath: transcode
            - name: silo-data
              mountPath: /catalog-seeds
              subPath: catalog-seeds
              readOnly: true
            - name: media
              mountPath: /mnt/media
              readOnly: true
            - name: render-device
              mountPath: /dev/dri
      volumes:
        - name: silo-data
          persistentVolumeClaim:
            claimName: silo-data-pvc-v1
        - name: media
          persistentVolumeClaim:
            claimName: media-pvc
        - name: render-device
          hostPath:
            path: /dev/dri
