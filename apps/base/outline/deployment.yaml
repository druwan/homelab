apiVersion: apps/v1
kind: Deployment
metadata:
  name: outline-redis
  namespace: life
spec:
  replicas: 1
  selector:
    matchLabels:
      app: outline-redis
  template:
    metadata:
      labels:
        app: outline-redis
    spec:
      containers:
        - name: outline-redis
          image: redis:8.12.0@sha256:d5dc9046df0c60dd919fb0c6a3c3af2c9c4c93fba71b5b7931ed2b076f7fe6ba
          ports:
            - containerPort: 6379
      restartPolicy: Always
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: outline
    role: app
  name: outline
  namespace: life
spec:
  replicas: 1
  selector:
    matchLabels:
      app: outline
  template:
    metadata:
      labels:
        app: outline
        role: app
    spec:
      securityContext:
        fsGroup: 3100
      containers:
        - image: outlinewiki/outline:1.13.0@sha256:4583bb244dbb4464d8a632c75044d3b2f9fe44382b6a4b84d97995f473b823e4
          name: outline
          ports:
            - containerPort: 3000
          securityContext:
            allowPrivilegeEscalation: false
          env:
            - name: NODE_ENV
              value: production

            - name: URL
              value: "https://outline.christophervestman.com"

            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: outline-db-credentials
                  key: outline-secret-key

            - name: UTILS_SECRET
              valueFrom:
                secretKeyRef:
                  name: outline-db-credentials
                  key: outline-utils-secret

            - name: DEFAULT_LANGUAGE
              value: en_US

            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: outline-db-credentials
                  key: database-uri

            - name: FORCE_HTTPS
              value: "true"

            - name: REDIS_URL
              value: "redis://outline-redis:6379"

            - name: FILE_STORAGE_LOCAL_ROOT_DIR
              value: /var/lib/outline/data

            - name: FILE_STORAGE
              value: "s3"

            - name: AWS_REGION
              value: "ume1"

            - name: AWS_S3_FORCE_PATH_STYLE
              value: "true"

            - name: AWS_S3_UPLOAD_BUCKET_NAME
              value: "outline-uploads"

            - name: AWS_S3_UPLOAD_BUCKET_URL
              value: "https://s3.hexabyte.se"

            - name: FILE_STORAGE_UPLOAD_MAX_SIZE
              value: "26214400"

            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: hexabyte-credentials
                  key: ACCESS_KEY_ID

            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: hexabyte-credentials
                  key: ACCESS_SECRET_KEY

            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef: { name: outline-oidc, key: OIDC_CLIENT_ID }
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef: { name: outline-oidc, key: OIDC_CLIENT_SECRET }
            - name: OIDC_SCOPES
              value: "openid profile email offline_access"
            - name: OIDC_AUTH_URI
              value: "https://authentik.christophervestman.com/application/o/authorize/"
            - name: OIDC_TOKEN_URI
              value: "https://authentik.christophervestman.com/application/o/token/"
            - name: OIDC_USERINFO_URI
              value: "https://authentik.christophervestman.com/application/o/userinfo/"

          resources:
            requests:
              memory: 320Mi
            limits:
              memory: 640Mi

          volumeMounts:
            - mountPath: /var/lib/outline/data
              name: outline-data
      restartPolicy: Always
      volumes:
        - name: outline-data
          persistentVolumeClaim:
            claimName: outline-data-pvc-v1
