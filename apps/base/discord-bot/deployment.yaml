apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: discord-bot
  name: discord-bot
  namespace: discord-bot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: discord-bot
  template:
    metadata:
      labels:
        app: discord-bot
    spec:
      containers:
        - image: ghcr.io/druwan/discord-bot:v0.2.22
          name: discord-bot
          env:
            - name: NODE_ENV
              value: production
          resources:
            requests:
              memory: 192Mi
            limits:
              memory: 384Mi
          envFrom:
            - secretRef:
                name: discord-bot-creds
