apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tabs
  namespace: tabs
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: kube-system
      sectionName: websecure
  hostnames:
    - tabs.christophervestman.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: its-mytabs
          port: 47777
