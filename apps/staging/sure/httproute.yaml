apiVersion: networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sure
  namespace: sure
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: kube-system
      sectionName: websecure
  hostnames:
    - sure.christophervestman.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
    - host: sure.christophervestman.com
      backendRefs:
        - name: sure
          port: 3000
