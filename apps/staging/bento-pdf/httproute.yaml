apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bento-pdf
  namespace: bento-pdf
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: kube-system
      sectionName: websecure
  hostnames:
    - pdf.christophervestman.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: bento-pdf
          port: 8080
