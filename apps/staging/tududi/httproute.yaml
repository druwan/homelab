apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tududi
  namespace: tududi
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: kube-system
      sectionName: websecure
  hostnames:
    - tududi.christophervestman.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: tududi
          port: 3002
