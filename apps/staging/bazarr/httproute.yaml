apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bazaar
  namespace: media
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: kube-system
      sectionName: websecure
  hostnames:
    - bazaar.christophervestman.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: bazaar
          port: 6767
