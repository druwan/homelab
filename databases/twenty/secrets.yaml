apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: twenty-db-superuser
  namespace: twenty
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-kv-store
  target:
    name: twenty-db-superuser
    creationPolicy: Owner
    template:
      data:
        username: "postgres"
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: cnpg-admin-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hexabyte-credentials
  namespace: twenty
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-kv-store
  target:
    name: hexabyte-credentials
    creationPolicy: Owner
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: hexabyte-access-key
    - secretKey: ACCESS_SECRET_KEY
      remoteRef:
        key: hexabyte-secret-access-key
    - secretKey: RESTIC_PASSWORD
      remoteRef:
        key: restic-backup-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: twenty-db-credentials
  namespace: twenty
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-kv-store
  target:
    name: twenty-db-credentials
    creationPolicy: Owner
    template:
      data:
        username: twenty
        password: "{{ .dbPassword }}"
        encryption_key: "{{ .encryptionKey }}"
        fallback_encryption_key: "{{ .fallbackEncryptionKey }}"
        pg_database_url: "postgresql://twenty:{{ .dbPassword }}@twenty-db-v0-rw.twenty.svc.cluster.local:5432/twenty"

  data:
    - secretKey: dbPassword
      remoteRef:
        key: twenty-db-password

    - secretKey: encryptionKey
      remoteRef:
        key: twenty-encryption-key

    - secretKey: fallbackEncryptionKey
      remoteRef:
        key: twenty-fallback-encryption-key
