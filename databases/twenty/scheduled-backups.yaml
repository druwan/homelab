apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: twenty-db-daily-hexabyte
  namespace: twenty
spec:
  immediate: true
  schedule: "0 30 4 * * *"
  cluster:
    name: twenty-db-v0
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
    parameters:
      barmanObjectName: twenty-db-backup-hexabyte
  backupOwnerReference: cluster
---
apiVersion: postgresql.cnpg.io/v1
kind: Backup
metadata:
  name: twenty-db-ondemand
  namespace: twenty
spec:
  cluster:
    name: twenty-db-v0
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
    parameters:
      barmanObjectName: twenty-db-backup-hexabyte
