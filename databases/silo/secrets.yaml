apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: silo-db-superuser
  namespace: media
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-kv-store
  target:
    name: silo-db-superuser
    creationPolicy: Owner
    template:
      data:
        username: "postgres"
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: cnpg-admin-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hexabyte-credentials
  namespace: media
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-kv-store
  target:
    name: hexabyte-credentials
    creationPolicy: Owner
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: hexabyte-access-key
    - secretKey: ACCESS_SECRET_KEY
      remoteRef:
        key: hexabyte-secret-access-key
    - secretKey: RESTIC_PASSWORD
      remoteRef:
        key: restic-backup-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: silo-db-credentials
  namespace: media
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-kv-store
  target:
    name: silo-db-credentials
    creationPolicy: Owner
    template:
      data:
        username: "silo"
        password: "{{ .dbPassword }}"
        postgres_uri: "postgresql://silo:{{ .dbPassword }}@silo-db-v0-rw.media.svc.cluster.local:5432/silo"
        silo_meili_master_key: "{{ .siloMeiliMasterKey }}"
        silo_secret_key: "{{ .siloSecretKey }}"
  data:
    - secretKey: dbPassword
      remoteRef:
        key: silo-db-password
    - secretKey: siloMeiliMasterKey
      remoteRef:
        key: silo-meili-master-key
    - secretKey: siloSecretKey
      remoteRef:
        key: silo-secret-key
