apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: paperless-ngx-db-v2
  namespace: paperless-ngx
spec:
  description: "Postgres cluster for Paperless-ngx"
  imageName: ghcr.io/cloudnative-pg/postgresql:18-minimal-trixie
  imagePullPolicy: Always
  inheritedMetadata:
    labels:
      app: paperless-ngx-db
      policy-type: database
  instances: 1

  storage:
    size: 2Gi
    storageClass: longhorn
    resizeInUseVolumes: true

  walStorage:
    size: 2Gi
    storageClass: longhorn

  superuserSecret:
    name: paperless-ngx-db-superuser

  # FRESH INSTALL: contains no backup. Have to use initdb
  # bootstrap:
  #   initdb:
  #     database: paperless
  #     owner: paperless
  #     secret:
  #       name: paperless-ngx-db-credentials

  bootstrap:
    initdb:
      import:
        type: monolith
        databases:
          - paperless
        roles:
          - paperless
        source:
          externalCluster: paperless-ngx-db-v1

  externalClusters:
    - name: paperless-ngx-db-v1
      connectionParameters:
        host: paperless-ngx-db-v1-rw.paperless-ngx.svc.cluster.local
        user: postgres
        dbname: postgres
        sslmode: prefer
      password:
        name: paperless-ngx-db-superuser
        key: password

  # # DISTASTER RECOVERY: Once a backup exists, replace the initdb with the block below
  # bootstrap:
  #   recovery:
  #     source: paperless-ngx-db-hexabyte
  #     database: paperless
  #     owner: paperless
  #     secret:
  #       name: paperless-ngx-db-credentials
  # externalClusters:
  #   - name: paperless-ngx-db-hexabyte
  #     plugin:
  #       name: barman-cloud.cloudnative-pg.io
  #       parameters:
  #         barmanObjectName: paperless-ngx-db-backup-hexabyte
  #         serverName: paperless-ngx-db

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: paperless-ngx-db-backup-hexabyte

  managed:
    services:
      disabledDefaultServices: ["r", "ro"]
    roles:
      - name: paperless
        ensure: present
        login: true
        createdb: false
        passwordSecret:
          name: paperless-ngx-db-credentials
