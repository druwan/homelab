apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: authentik-db-v1
  namespace: authentik
spec:
  description: "Postgres cluster for authentik application"
  imageName: ghcr.io/cloudnative-pg/postgresql:18-minimal-trixie
  imagePullPolicy: Always
  inheritedMetadata:
    labels:
      app: authentik-db
      policy-type: database
  instances: 1

  storage:
    size: 2Gi
    storageClass: longhorn
    resizeInUseVolumes: true

  walStorage:
    size: 2Gi
    storageClass: longhorn

  superuserSecret:
    name: authentik-db-superuser

  # # FRESH INSTALL: contains no backup. Have to use initdb
  # bootstrap:
  #   initdb:
  #     database: authentik
  #     owner: authentik
  #     secret:
  #       name: authentik-db-credentials

  # Bootstrap from an previous deployment
  bootstrap:
    pg_basebackup:
      source: authentik-db-v0

  externalClusters:
    - name: authentik-db-v0
      connectionParameters:
        host: authentik-db-v0-rw.authentik.svc.cluster.local
        user: streaming_replica
        dbname: authentik
        sslmode: verify-ca
      sslKey:
        name: authentik-db-v0-replication
        key: tls.key
      sslCert:
        name: authentik-db-v0-replication
        key: tls.crt
      sslRootCert:
        name: authentik-db-v0-ca
        key: ca.crt

  # DISASTER RECOVERY: Once a backup exists, replace the initdb with the block below
  # bootstrap:
  #   recovery:
  #     source: authentik-db-hexabyte
  #     database: authentik
  #     owner: authentik
  #     secret:
  #       name: authentik-db-credentials
  # externalClusters:
  #   - name: authentik-db-hexabyte
  #     plugin:
  #       name: barman-cloud.cloudnative-pg.io
  #       parameters:
  #         barmanObjectName: authentik-db-backup-hexabyte
  #         serverName: authentik-db

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: authentik-db-backup-hexabyte

  managed:
    services:
      disabledDefaultServices: ["r", "ro"]

    roles:
      - name: authentik
        ensure: present
        login: true
        createdb: false
        passwordSecret:
          name: authentik-db-credentials
